project:
  type: website
  resources:
    - "assets/"
  output-dir: docs
  render:
    - "*.qmd"
    - "!jurados/"
website:
  title: "Jurados"
  site-url: https://jurados.github.io
  description: "This is Steve Jurado's personal blog"
  page-footer: 
    center:
      - icon: github
        href: https://github.com/jurados
      - icon: twitter
        href: https://twitter.com/SteveJurado
      - icon: facebook
        href: https://www.facebook.com/steve.juradopinilla
      - icon: linkedin
        href: https://www.linkedin.com/in/astrojurados/
  navbar:
    pinned: true
    #background: dark
    right:
      - text: Research
        href: pages/research.qmd
      - text: Projects
        href: pages/projects.qmd
      - text: Blog
        href: pages/blog.qmd
      - text: Vitae
        href: pages/vitae.qmd
      - text: My Journal
        href: pages/journal.qmd
      - text: Academic Notes
        href: pages/academic.qmd
format:
  html:
    link-external-newwindow: true
    theme: styles/theme_light.scss
    css: styles/styles.css

editor: visual

